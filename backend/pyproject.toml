[project]
name = "backend"
version = "0.1.0"
description = "FastAPI service for Code Mentor"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16.0",
    "aiosqlite>=0.21.0",
    "asyncpg>=0.30.0",
    "fastapi==0.115.6",
    "greenlet>=3.2.0",
    "httpx>=0.28.1",
    "openai==1.58.1",
    "pydantic==2.10.4",
    "python-dotenv==1.0.1",
    "sqlalchemy>=2.0.41",
    "uvicorn[standard]==0.32.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "anyio[trio]>=4.0",
]

[tool.ruff]
target-version = "py312"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "S"]
ignore = ["S101", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
